[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-bridge-core"
version = "0.1.0"
description = "Dependency-light shared domain foundation for Réunia Career Bridge"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["career_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests/shared"]
addopts = "-q"
