name: Runtime tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: testing
      OPENAI_API_KEY: browser-e2e-test-key
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Compile Python sources
        run: python -m compileall -q app.py career_bridge job_discovery products scripts tests

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run strict integration and browser gates
        run: python tests/run_final_integration_checks.py --require-runtime --json-output reports/validation/runtime-ci.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-report
          path: reports/validation/runtime-ci.json
          if-no-files-found: warn
