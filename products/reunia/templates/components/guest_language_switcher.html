<div class="guest-language-switcher" data-guest-language-dropdown>
    <button
        type="button"
        class="guest-language-trigger"
        data-guest-language-trigger
        aria-label="Change language"
        title="Change language"
        aria-haspopup="menu"
        aria-expanded="false"
    >
        <span class="guest-language-current-flag" aria-hidden="true">
            {% if app_language == 'fr' %}
                <svg viewBox="0 0 28 18" focusable="false">
                    <rect width="9.34" height="18" fill="#0055a4"></rect>
                    <rect x="9.34" width="9.33" height="18" fill="#fff"></rect>
                    <rect x="18.67" width="9.33" height="18" fill="#ef4135"></rect>
                </svg>
            {% else %}
                <svg viewBox="0 0 28 18" focusable="false">
                    <rect width="28" height="18" fill="#fff"></rect>
                    <path fill="#b22234" d="M0 0h28v2H0zm0 4h28v2H0zm0 4h28v2H0zm0 4h28v2H0zm0 4h28v2H0z"></path>
                    <rect width="12" height="10" fill="#3c3b6e"></rect>
                    <g fill="#fff">
                        <circle cx="2" cy="2" r=".65"></circle><circle cx="6" cy="2" r=".65"></circle><circle cx="10" cy="2" r=".65"></circle>
                        <circle cx="4" cy="5" r=".65"></circle><circle cx="8" cy="5" r=".65"></circle>
                        <circle cx="2" cy="8" r=".65"></circle><circle cx="6" cy="8" r=".65"></circle><circle cx="10" cy="8" r=".65"></circle>
                    </g>
                </svg>
            {% endif %}
        </span>
        <svg class="guest-language-chevron" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="m6 8 4 4 4-4"></path>
        </svg>
    </button>

    <div class="guest-language-menu" data-guest-language-menu role="menu" aria-label="Language" hidden>
        <button
            type="button"
            class="guest-language-option{% if app_language == 'en' %} active{% endif %}"
            data-guest-language-toggle
            data-target-language="en"
            role="menuitemradio"
            aria-label="Use English"
            aria-checked="{{ 'true' if app_language == 'en' else 'false' }}"
        >
            <span>English</span>
            <span class="guest-language-option-flag" aria-hidden="true">
                <svg viewBox="0 0 28 18" focusable="false">
                    <rect width="28" height="18" fill="#fff"></rect>
                    <path fill="#b22234" d="M0 0h28v2H0zm0 4h28v2H0zm0 4h28v2H0zm0 4h28v2H0zm0 4h28v2H0z"></path>
                    <rect width="12" height="10" fill="#3c3b6e"></rect>
                    <g fill="#fff">
                        <circle cx="2" cy="2" r=".65"></circle><circle cx="6" cy="2" r=".65"></circle><circle cx="10" cy="2" r=".65"></circle>
                        <circle cx="4" cy="5" r=".65"></circle><circle cx="8" cy="5" r=".65"></circle>
                        <circle cx="2" cy="8" r=".65"></circle><circle cx="6" cy="8" r=".65"></circle><circle cx="10" cy="8" r=".65"></circle>
                    </g>
                </svg>
            </span>
        </button>

        <button
            type="button"
            class="guest-language-option{% if app_language == 'fr' %} active{% endif %}"
            data-guest-language-toggle
            data-target-language="fr"
            role="menuitemradio"
            aria-label="Utiliser le français"
            aria-checked="{{ 'true' if app_language == 'fr' else 'false' }}"
        >
            <span>Français</span>
            <span class="guest-language-option-flag" aria-hidden="true">
                <svg viewBox="0 0 28 18" focusable="false">
                    <rect width="9.34" height="18" fill="#0055a4"></rect>
                    <rect x="9.34" width="9.33" height="18" fill="#fff"></rect>
                    <rect x="18.67" width="9.33" height="18" fill="#ef4135"></rect>
                </svg>
            </span>
        </button>
    </div>
</div>
