{% extends 'base.html' %}

{% block title %}Reset Password - RÃ©unia{% endblock %}

{% block page_styles %}
<link rel="stylesheet" href="{{ static_asset('css/pages/login.css') }}">
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-shell auth-shell-single">
        <section class="auth-form-panel">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Reset your password</h1>
                    <p>Enter your account email. If it matches an account, we will send a time-limited reset link.</p>
                </div>
                <form action="{{ url_for('auth.handle_forgot_password') }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label class="form-label" for="reset-email">Email address</label>
                        <input class="form-input" id="reset-email" name="email" type="email" autocomplete="email" required autofocus>
                    </div>
                    <button class="submit-btn" type="submit">Send reset link</button>
                </form>
                <div class="recovery-actions">
                    <a class="recovery-link" href="{{ url_for('auth.login_page') }}">Back to sign in</a>
                </div>
            </div>
        </section>
    </div>
</div>
{% endblock %}
